; enable PIPANEL if PIDP_PANEL environment variable is "pidp11"
; configure PIPANEL registers from environment variables (if defined)
;
if "%PIDP_PANEL%" != "pidp11" return SCPE_OK
attach pipanel %PIDP_PANEL%
if "%PIDP_11_ROTATION%" == "FLIP" deposit PIPANEL KNOB_ROTATION 1
if "%PIDP_11_KNOB_ADDR%" != "" deposit PIPANEL KNOB_ADDR %PIDP_11_KNOB_ADDR%
if "%PIDP_11_KNOB_DATA%" != "" deposit PIPANEL KNOB_DATA %PIDP_11_KNOB_DATA%
return
